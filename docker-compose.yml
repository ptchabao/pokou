# Environnement de développement complet : PostgreSQL, Redis, MinIO et l'API.
#
#   docker compose up --build
#   → API sur http://localhost:8000 (docs : /docs)
#   → console MinIO sur http://localhost:9001 (pokou / pokou-dev-secret)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokou
      POSTGRES_PASSWORD: pokou
      POSTGRES_DB: pokou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokou"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pokou
      MINIO_ROOT_PASSWORD: pokou-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://pokou:pokou@postgres:5432/pokou
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: pokou
      S3_SECRET_KEY: pokou-dev-secret
      S3_BUCKET: pokou-media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media_storage

volumes:
  postgres_data:
  minio_data:
  media_data:
