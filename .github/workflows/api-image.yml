# Construit l'image de l'API et la publie sur GHCR, à chaque push sur main
# qui touche le serveur. Kubero (pipeline « pokou », construction externe)
# déploie ensuite cette image : il ne la construit pas lui-même.
#
# Étiquettes : sha-<commit> (immuable, celle qu'on déploie) et main.
name: Image API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pokou-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
