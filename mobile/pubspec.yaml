name: pokou
description: "Pokou — messagerie, communautés, appels et marché."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.21.3+41

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Le découpage en graphèmes — un emoji occupe plusieurs unités de code,
  # et `text[text.length - 1]` en rendrait la moitié. Flutter l'embarque
  # déjà, mais s'appuyer sur une dépendance transitive casse le jour où il
  # cesse de la réexporter.
  characters: ^1.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.6.2
  # HTTP client for the MAHIZU API
  http: ^1.2.2
  # MediaType pour les uploads multipart (pièces jointes Pokou) — dépendance
  # transitive de `http`, déclarée explicitement car importée directement.
  http_parser: ^4.1.2
  # Bearer token storage (Keychain/Keystore, not SharedPreferences)
  flutter_secure_storage: ^9.2.2
  # Primitives du chiffrement individuel et des pièces jointes — X25519,
  # Ed25519, AES-GCM, HKDF, HMAC (Apache-2.0).
  cryptography: ^2.9.0
  # Signal Sender Keys pour les messages de groupe (GPL-3.0).
  libsignal_protocol_dart: ^0.8.2
  # Empreinte SHA-1 pour nommer les fichiers du cache d'apercu de lien.
  crypto: ^3.0.0
  # Local chat history persistence (offline-first "memory")
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  web_socket_channel: ^3.0.1
  # Device address book access for contact discovery (WhatsApp/Telegram-style)
  flutter_contacts: ^1.1.9+2
  # Normalizes device contact numbers (often in local format) to E.164,
  # using the signed-in user's own number to infer the default region —
  # same approach WhatsApp/Telegram use for contact matching.
  phone_numbers_parser: ^9.0.3

  # Pokou messaging — pièces jointes (Phase B)
  record: ^6.2.1          # capture des notes vocales (borné par le SDK Dart 3.11.0 installé)
  just_audio: ^0.10.6      # lecture des notes vocales
  # Les attributs audio Android de la sonnerie (flux sonnerie et non média,
  # voir ringtone_player.dart) — dépendance transitive de just_audio,
  # déclarée car importée directement.
  audio_session: ^0.2.4
  file_picker: ^11.0.3     # sélection de documents
  image_picker: ^1.2.3     # photo/vidéo depuis galerie ou caméra
  # Rognage et rotation avant envoi. S'appuie sur les éditeurs NATIFS
  # (uCrop sur Android, TOCropViewController sur iOS) : le geste est celui
  # que l'utilisateur connaît déjà, et le redimensionnement est fait par la
  # plateforme plutôt que par du code Dart sur une image de 12 mégapixels.
  image_cropper: ^8.1.0
  video_player: ^2.11.1    # lecture vidéo inline dans les bulles (borné par le SDK Dart 3.11.0 installé)
  permission_handler: ^13.0.1  # permissions micro/caméra/stockage à l'exécution
  # Cache disque temporaire pour les médias téléchargés (audio/vidéo) —
  # just_audio/video_player ont besoin d'un chemin de fichier, pas d'octets bruts.
  path_provider: ^2.1.6
  # Ouvre un document téléchargé (Pokou Phase B) avec l'app native associée.
  open_filex: ^4.7.0
  # Devine le MIME type d'un document choisi via file_picker (qui ne le
  # fournit pas lui-même) à partir de son extension.
  mime: ^2.0.0
  # Pokou — appels audio/vidéo/de groupe (Phase D), LiveKit Cloud.
  livekit_client: ^2.11.0

  # Pokou — notifications push via Firebase Cloud Messaging.
  # Android : android/app/google-services.json ; Web : Firebase options + VAPID.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  web: ^1.1.1
  # Affiche une notification quand un message FCM arrive pendant que l'app
  # est au premier plan — Android ne le fait pas automatiquement dans ce cas.
  flutter_local_notifications: ^18.0.1

  # Liens d'invitation cliquables (Android App Links / iOS Universal Links) —
  # successeur maintenu de `uni_links`, qui n'est plus mis à jour. Firebase
  # Dynamic Links (arrêté par Google en août 2025) n'est PAS utilisé ici.
  app_links: ^7.0.0

  # Ouvre une app externe (cartes, WhatsApp) depuis une bulle de position
  # partagée ou une carte de visite — aucune carte interactive n'est
  # embarquée dans ce projet (pas de clé de service de cartes configurée).
  # Importée par contact_card_bubble.dart/location_bubble.dart.
  url_launcher: ^6.3.2
  # Feuille de partage du système — laisse choisir l'application
  # d'envoi au lieu d'imposer WhatsApp (voir core/sharing/).
  share_plus: ^10.1.4
  geolocator: ^14.0.2
  sqflite_sqlcipher: ^3.4.1
  gal: ^2.3.3
  emoji_picker_flutter: ^4.4.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  # Export daté du mode preuve à deux, produit SUR l'appareil : le serveur
  # n'a pas le texte des messages chiffrés (voir proof_export.dart).
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  flutter_secure_storage_platform_interface: ^1.1.2
  sqflite_common_ffi: ^2.3.4+4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# permission_handler_android 14.0.0's build.gradle.kts uses Kotlin Gradle
# Plugin APIs (compilerOptions { jvmTarget = ... }) that fail to resolve
# against this project's Gradle/AGP toolchain — pinned back to 13.0.1, the
# last version shipping a plain (working) build.gradle.
dependency_overrides:
  permission_handler_android: 13.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Génère lib/l10n/app_localizations.dart depuis les .arb (voir l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # Sons d'appel (ringback appelant / sonnerie appelé) — générés par
  # pokou/tool/generate_ringtones.py, voir RingtonePlayer.
  fonts:
    # ── Outfit — titres, nombres, montants ─────────────────────────────
    # Géométrique, ouverte : le système de design la choisit pour ses
    # « distinct character openings », c'est-à-dire pour rester lisible
    # sous un soleil qui écrase les contrastes. Elle porte aussi les
    # montants en FCFA, là où un chiffre mal lu coûte cher.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    # ── Inter — corps de texte, libellés, données ──────────────────────
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/verses/
    - assets/fonts/
    - assets/audio/ringback.wav
    - assets/audio/ringtone.wav
    # Motif griffonné derrière les bulles — voir core/widgets/chat_wallpaper.dart.
    # WebP et non JPEG : sur du trait fin, la compression JPEG laisse des
    # halos visibles sur un aplat clair, et pèse ici trois fois plus lourd.
    - assets/chat_wallpaper.webp
    # Le logo officiel (IconKitchen), pour l'écran d'accueil.
    - assets/brand/

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
