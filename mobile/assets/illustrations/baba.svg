<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Baba : la tête d'un vieil homme, crâne dégarni, cheveux, sourcils et
       barbe blancs, yeux plissés par le sourire. Fond or de la marque. -->
  <circle cx="32" cy="32" r="32" fill="#F3E2B0"/>
  <!-- Oreilles -->
  <ellipse cx="14.5" cy="31" rx="3.4" ry="4.6" fill="#7A4A2C"/>
  <ellipse cx="49.5" cy="31" rx="3.4" ry="4.6" fill="#7A4A2C"/>
  <!-- Cheveux blancs sur les côtés -->
  <path d="M15.5 27c0-6 2.5-11 6-13.5-1.5 4-1.8 8-1.2 12.5z" fill="#F7F4EE"/>
  <path d="M48.5 27c0-6-2.5-11-6-13.5 1.5 4 1.8 8 1.2 12.5z" fill="#F7F4EE"/>
  <!-- Visage -->
  <path d="M17 29c0-10.5 6.7-17 15-17s15 6.5 15 17v5c0 8.5-6.7 15-15 15s-15-6.5-15-15z" fill="#8B5634"/>
  <!-- Reflet du crâne -->
  <path d="M25 16.5c2-1.3 4.4-2 7-2" stroke="#A86D47" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rides du front -->
  <path d="M26 21.5c4-1.2 8-1.2 12 0" stroke="#6E4127" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <!-- Sourcils blancs, touffus -->
  <path d="M21.5 27.2c2.2-2 5.3-2.2 7.6-.8" stroke="#F7F4EE" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M42.5 27.2c-2.2-2-5.3-2.2-7.6-.8" stroke="#F7F4EE" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- Yeux plissés -->
  <path d="M23.2 31.3c1.4 1.2 3.4 1.2 4.8 0" stroke="#2A1A12" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M36 31.3c1.4 1.2 3.4 1.2 4.8 0" stroke="#2A1A12" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Nez -->
  <path d="M30 33.5c-.8 2.4-.6 3.8 2 4.1 2.6-.3 2.8-1.7 2-4.1" fill="#76452A"/>
  <!-- Barbe blanche -->
  <path d="M17.6 35c1.2 9 6.8 16.5 14.4 16.5S45.2 44 46.4 35c-2.3 2.4-5 3.4-7.4 3.2-2.1-.2-4.2-1.3-7-1.3s-4.9 1.1-7 1.3c-2.4.2-5.1-.8-7.4-3.2z" fill="#F7F4EE"/>
  <!-- Moustache -->
  <path d="M24.5 39.3c2.2-2.4 5-2.6 7.5-1.2 2.5-1.4 5.3-1.2 7.5 1.2-2.6.4-5 .2-7.5-.8-2.5 1-4.9 1.2-7.5.8z" fill="#E6E1D8"/>
  <!-- Sourire -->
  <path d="M28.6 42.2c2.2 1.3 4.6 1.3 6.8 0" stroke="#8B5634" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
