apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pokou
resources:
  - ../../base
images:
  # Remplacé à chaque déploiement par deploy.sh (kustomize edit set image).
  - name: pokou-api
    newName: ghcr.io/pokou/pokou-api
    newTag: "1.18.1"
# Le Secret de l'API, construit depuis un fichier HORS dépôt
# (overlays/prod/secrets.env, ignoré par git). Avec un gestionnaire de
# secrets (External Secrets, Sealed Secrets), retirer ce générateur.
secretGenerator:
  - name: pokou-api-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
patches:
  - target:
      kind: ConfigMap
      name: pokou-api-config
    patch: |-
      - op: replace
        path: /data/S3_REGION
        value: "eu-west-1"
