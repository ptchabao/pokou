# Le relais de l'outbox vers Kafka (app/workers/outbox_relay.py). Une seule
# réplique suffit longtemps ; deux sont sans danger (FOR UPDATE SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokou-outbox-relay
  labels:
    app.kubernetes.io/name: pokou-outbox-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pokou-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokou-outbox-relay
    spec:
      serviceAccountName: pokou-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: pokou-api
          command: ["python", "-m", "app.workers.outbox_relay"]
          envFrom:
            - configMapRef:
                name: pokou-api-config
            - secretRef:
                name: pokou-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-ca
          secret:
            secretName: pokou-kafka-cluster-ca-cert
            optional: true
