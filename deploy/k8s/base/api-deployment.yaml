apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokou-api
  labels:
    app.kubernetes.io/name: pokou-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: pokou-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Jamais moins de capacité pendant un déploiement : les WebSocket
      # d'une pod qui part se reconnectent sur les autres.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokou-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      serviceAccountName: pokou-api
      automountServiceAccountToken: false
      # Laisse à uvicorn le temps de fermer proprement les WebSocket et de
      # retirer les présences de Redis (voir ws_registry.stop).
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pokou-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pokou-api
      containers:
        - name: api
          image: pokou-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pokou-api-config
            - secretRef:
                name: pokou-api-secrets
          env:
            # Un identifiant par pod pour le verrou de l'ordonnanceur
            # (core/scheduler.py) : lisible dans les journaux.
            - name: POKOU_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Le temps que l'Ingress retire la pod de ses cibles avant que
            # uvicorn ne cesse d'accepter : sinon, quelques 502 à chaque
            # déploiement.
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Repli local des médias. En production, S3 DOIT être configuré :
            # ce volume n'est pas partagé entre les pods.
            - name: media-fallback
              mountPath: /app/media_storage
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: media-fallback
          emptyDir: {}
        - name: kafka-ca
          secret:
            # Créé par Strimzi dans le namespace kafka, recopié dans pokou
            # (voir docs/deploiement-kubernetes.md, étape Kafka).
            secretName: pokou-kafka-cluster-ca-cert
            optional: true
