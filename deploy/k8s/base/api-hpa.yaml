apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pokou-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokou-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    # Descendre lentement : chaque pod retirée coupe ses WebSocket.
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
